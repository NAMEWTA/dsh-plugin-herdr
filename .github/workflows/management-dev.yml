name: Management development environment
on:
  push:
    branches: [feat/herdr-environment-management]
    paths: [.github/workflows/management-dev.yml]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Archive only tracked source, dependencies and runtime (no credentials)
        run: |
          mkdir -p "$RUNNER_TEMP/management-artifacts"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/management-artifacts/source.tgz"
          tar -czf "$RUNNER_TEMP/management-artifacts/dependencies.tgz" node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/management-artifacts/node"
      - uses: actions/upload-artifact@v4
        with:
          name: management-development
          path: ${{ runner.temp }}/management-artifacts/
          retention-days: 1
