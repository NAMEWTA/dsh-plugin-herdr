name: Recover refactor snapshot
on:
  push:
    branches: [refactor/modular-workbench]
    paths: [.github/workflows/refactor-recover.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover previously uploaded repository blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir recovered
          gh api repos/NAMEWTA/dsh-plugin-herdr/git/blobs/a4522f4101b3e5f4b44c74a793e6117627bbf649 --jq .content | base64 --decode > recovered/snapshot.xz
          python3 - <<'PY'
          import hashlib,lzma,pathlib,json
          p=pathlib.Path('recovered/snapshot.xz')
          data=p.read_bytes()
          print('bytes',len(data),'sha256',hashlib.sha256(data).hexdigest())
          try:
            raw=lzma.decompress(data)
            print('decoded bytes',len(raw),'sha256',hashlib.sha256(raw).hexdigest())
            pathlib.Path('recovered/snapshot.decoded').write_bytes(raw)
            try:
              obj=json.loads(raw)
              print('JSON shape', {k:len(v) for k,v in obj.items()})
            except Exception as exc:
              print('Not JSON:',type(exc).__name__)
          except Exception as exc:
            print('Decode:',type(exc).__name__,str(exc))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-refactor-snapshot
          path: recovered/
          retention-days: 1
