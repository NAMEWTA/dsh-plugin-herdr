name: UI development workspace
on:
  push:
    branches: [feat/herdr-navigation-studio]
    paths: [.github/workflows/ui-snapshot.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - run: pnpm install --frozen-lockfile
      - name: Capture repository sources and dependencies, never credentials
        run: |
          tar --exclude=./.git --exclude=./.github -czf "$RUNNER_TEMP/ui-workspace.tgz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-development-workspace
          path: ${{ runner.temp }}/ui-workspace.tgz
          retention-days: 2
          if-no-files-found: error
