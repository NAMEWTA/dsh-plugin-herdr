name: Terminal regression baseline
on:
  push:
    branches: [fix/terminal-initialization]
    paths: [.github/workflows/terminal-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked public repository source only
        run: git archive --format=tar.gz --output=terminal-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-source
          path: terminal-source.tar.gz
          retention-days: 2
          if-no-files-found: error
