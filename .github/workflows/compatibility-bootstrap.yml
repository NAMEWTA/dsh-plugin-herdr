# Temporary lockfile recovery. Remove this workflow before merging.
name: Compatibility bootstrap
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: compat-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.head_ref == 'fix/dsh-alpha2-install' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate a clean lockfile without reusing old peers
        run: |
          rm pnpm-lock.yaml
          pnpm install --no-frozen-lockfile --strict-peer-dependencies
          pnpm build && pnpm typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lockfile
          path: pnpm-lock.yaml
          retention-days: 2
  save-lockfile:
    needs: candidate
    if: github.head_ref == 'fix/dsh-alpha2-install' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resolved-lockfile
          path: lockfile
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const branch = 'fix/dsh-alpha2-install';
            const expected = context.payload.pull_request.head.sha;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
            if (current.data.object.sha !== expected) throw new Error('Branch advanced; refusing stale lockfile update');
            const content = fs.readFileSync('lockfile/pnpm-lock.yaml', 'utf8');
            const base = await github.rest.git.getCommit({ owner, repo, commit_sha: expected });
            const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
            const tree = await github.rest.git.createTree({ owner, repo, base_tree: base.data.tree.sha, tree: [{ path: 'pnpm-lock.yaml', mode: '100644', type: 'blob', sha: blob.data.sha }] });
            if (tree.data.sha === base.data.tree.sha) return;
            const commit = await github.rest.git.createCommit({ owner, repo, message: 'build: regenerate alpha.2 lockfile with strict peer resolution', tree: tree.data.sha, parents: [expected] });
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/' + branch, sha: commit.data.sha, force: false });
            core.notice('Committed only pnpm-lock.yaml: ' + commit.data.sha);
