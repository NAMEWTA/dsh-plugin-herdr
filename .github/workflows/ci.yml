name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and packed artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - name: Build the distributable and verify its contents
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          pnpm check:package artifacts/*.tgz
          (cd artifacts && sha256sum *.tgz > SHA256SUMS)
          npm view @deepseek-ai/dsh dist-tags --json > artifacts/dsh-dist-tags.json
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-plugin-package
          path: artifacts/
          retention-days: 30
  dsh-smoke:
    name: DSH Web ${{ matrix.dsh }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-alpha.1', '0.2.1-alpha.2']
    env:
      DSH_SMOKE_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: herdr-plugin-package
          path: artifacts
      - name: Verify artifact checksum
        run: cd artifacts && sha256sum --check SHA256SUMS
      - name: Install the published CLI and a pinned browser runner
        run: npm install --prefix "$RUNNER_TEMP/dsh-cli" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_SMOKE_VERSION" playwright@1.56.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/dsh-cli/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Install, activate Web dashboard, and uninstall in an isolated home
        run: node scripts/smoke-dsh.mjs "$RUNNER_TEMP/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js" artifacts/*.tgz "$RUNNER_TEMP/dsh-cli/node_modules/playwright/index.mjs" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-smoke-${{ matrix.dsh }}
          path: evidence/
          retention-days: 14
  integration:
    name: Herdr 0.9.0 protocol 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Herdr binary
        run: |
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl --fail --location --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.0/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr-bin/herdr"
          echo "4fa1a01158dd8043da92d31b270780b0dcc10603038d9b61cac4d81ab63fb71f  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
      - name: Run real tests in an isolated Herdr session (no silent skip)
        env:
          HERDR_REQUIRE_INTEGRATION: '1'
        run: |
          export HERDR_SESSION="dsh-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          herdr server >"$RUNNER_TEMP/herdr-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if herdr status server --json | grep -q '"running": *true'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          pnpm test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herdr-integration-log
          path: ${{ runner.temp }}/herdr-server.log
          retention-days: 14
