name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and packed artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - name: Build the distributable and verify its contents
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
          pnpm check:package artifacts/*.tgz
          (cd artifacts && sha256sum *.tgz > SHA256SUMS)
          npm view @deepseek-ai/dsh dist-tags --json > artifacts/dsh-dist-tags.json
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-plugin-package
          path: artifacts/
          retention-days: 30
  dsh-smoke:
    name: DSH Web ${{ matrix.dsh }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-alpha.1', '0.2.1-alpha.2']
    env:
      DSH_SMOKE_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: herdr-plugin-package
          path: artifacts
      - name: Verify artifact checksum
        run: cd artifacts && sha256sum --check SHA256SUMS
      - name: Install the published CLI and a pinned browser runner
        run: npm install --prefix "$RUNNER_TEMP/dsh-cli" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_SMOKE_VERSION" playwright@1.56.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/dsh-cli/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Install pinned Herdr
        run: bash scripts/install-herdr-ci.sh
      - name: Install, activate Web dashboard, and uninstall in an isolated home
        run: bash scripts/run-herdr-ci.sh node scripts/smoke-dsh.mjs "$RUNNER_TEMP/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js" artifacts/*.tgz "$RUNNER_TEMP/dsh-cli/node_modules/playwright/index.mjs" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-smoke-${{ matrix.dsh }}
          path: evidence/
          retention-days: 14
  integration:
    name: Herdr 0.9.0 protocol 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Herdr binary
        run: bash scripts/install-herdr-ci.sh
      - name: Run real tests in an isolated Herdr session (no silent skip)
        env:
          HERDR_REQUIRE_INTEGRATION: '1'
        run: bash scripts/run-herdr-ci.sh pnpm test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herdr-integration-log
          path: ${{ runner.temp }}/herdr-server.log
          retention-days: 14
  release:
    name: Publish verified GitHub download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, dsh-smoke, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: herdr-plugin-package
          path: artifacts
      - name: Publish a versioned download (never overwrite; never npm)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          tag="v$version"
          (cd artifacts && sha256sum --check SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its artifacts. Bump package version for a new release."
            exit 0
          fi
          gh release create "$tag" artifacts/*.tgz artifacts/SHA256SUMS artifacts/dsh-dist-tags.json --target "$GITHUB_SHA" --title "Herdr plugin $version" --notes "Prebuilt plugin for the DSH releases in COMPATIBILITY.md. Node 24+ required. Install the .tgz with dsh plugin --profile web add /path/to/package.tgz and restart DSH Web. This download passed the main-branch quality, packed-install, real Herdr and published DSH Web smoke checks. No npm publication is performed."
