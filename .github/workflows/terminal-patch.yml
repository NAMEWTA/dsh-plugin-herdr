name: Verify terminal fix source
on:
  push:
    branches: [fix/terminal-initialization]
    paths: [.github/workflows/terminal-patch.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source delta and create source-only tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,lzma,pathlib,urllib.request
          repo='NAMEWTA/dsh-plugin-herdr'
          parent=os.environ['GITHUB_SHA']
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert api('git/ref/heads/fix/terminal-initialization')['object']['sha']==parent
          parts=[]
          for sha,size in [('da38ce22b239693e92f396ce95a06d4c3dcfb9a8',7500),('8fc69f6029594ea1d28d80255f6d8c0d01117fae',5460)]:
              data=base64.b64decode(api('git/blobs/'+sha)['content'])
              assert len(data)==size and blob(data)==sha
              parts.append(data)
          data=b''.join(parts)
          expected='6641b7554ed660b552ed62f5f6a7aa3ef09eb73e69bdf8ee83d482ea3739f1cb'
          assert len(data)==12960 and hashlib.sha256(data).hexdigest()==expected
          source=json.loads(lzma.decompress(data))
          assert len(source['updates'])==35 and len(source['files'])==6 and len(source['expected'])==41
          assert set(source['updates'])|set(source['files'])==set(source['expected'])
          for path in source['expected']:
              p=pathlib.PurePosixPath(path)
              assert not p.is_absolute() and not {'.git','.github','..'}&set(p.parts) and str(p)==path
          for path,patch in source['updates'].items():
              p=pathlib.Path(path);original=p.read_bytes()
              assert blob(original)==patch['base'], 'Base mismatch: '+path
              text=original.decode()
              for start,end,replacement in sorted(patch['edits'],reverse=True):
                  assert 0<=start<=end<=len(text)
                  text=text[:start]+replacement+text[end:]
              p.write_text(text)
          for path,text in source['files'].items():
              p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          entries=[]
          for path,sha in source['expected'].items():
              content=pathlib.Path(path).read_bytes()
              assert blob(content)==sha, 'Final mismatch: '+path
              entries.append({'path':path,'mode':'100644','type':'blob','content':content.decode()})
          base=api('git/commits/'+parent)['tree']['sha']
          tree=api('git/trees',{'base_tree':base,'tree':entries})['sha']
          final=api('git/trees/'+tree+'?recursive=1')
          assert not final.get('truncated')
          hashes={e['path']:e['sha'] for e in final['tree']}
          for path,sha in source['expected'].items():assert hashes[path]==sha,path
          print(json.dumps({'parent':parent,'tree':tree,'files':41,'sha256':expected,'refs_updated':False},indent=2))
          PY
