name: Review validation
on:
  push:
    branches: [fix/review-hardening-20261011]
  pull_request:
permissions:
  contents: read
concurrency:
  group: review-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.head_ref == 'fix/review-hardening-20261011' || github.ref == 'refs/heads/fix/review-hardening-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: pnpm quality
